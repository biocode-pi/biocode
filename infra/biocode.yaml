AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Biocode - landing page estatica: S3 privado + CloudFront (OAC) com HTTPS.
  Sem servidor, custo praticamente zero (so trafego e requisicoes).

Metadata:
  com.aws.cloudformation.Context:
    why: >-
      Projeto academico com creditos limitados. Stack separada da "smarthive" para
      nao misturar os ciclos de vida dos dois sites.
    must:
      - Bucket sempre privado; o CloudFront le pelo OAC.
      - Certificado ACM em us-east-1 (exigencia do CloudFront).

Parameters:
  Dominio:
    Type: String
    Default: ""
    AllowedPattern: "^([a-z0-9-]+\\.)+[a-z]{2,}$|^$"
  CertificadoArn:
    Type: String
    Default: ""
    Description: Certificado ACM (us-east-1) emitido para www.<Dominio>. So informe depois de ISSUED.

Conditions:
  TemDominio: !And
    - !Not [!Equals [!Ref Dominio, ""]]
    - !Not [!Equals [!Ref CertificadoArn, ""]]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Metadata:
      com.aws.cloudformation.Context:
        why: Arquivos estaticos da landing; pode ser recriado a partir do repositorio.
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expira-versoes-antigas
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SomenteHttps
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: LeituraPeloCloudFront
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  SiteOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Biocode
        Aliases: !If [TemDominio, [!Sub "www.${Dominio}"], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - TemDominio
          - AcmCertificateArn: !Ref CertificadoArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref AWS::NoValue
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOac.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

Outputs:
  SiteUrl:
    Value: !If
      - TemDominio
      - !Sub "https://www.${Dominio}"
      - !Sub "https://${Distribution.DomainName}"
  DistributionDomain:
    Description: Alvo do CNAME www no registro.br.
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  SiteBucketName:
    Value: !Ref SiteBucket
